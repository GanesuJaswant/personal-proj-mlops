project:
  name: "Car Price Prediction MLOps"
  version: "1.0.0"
  description: "End-to-end MLOps pipeline for automobile valuation, registry management, API serving, and drift monitoring."

data:
  raw_path: "data/raw/CarPrice_Assignment.csv"
  raw_churn_alias: "data/raw/churn.csv"
  processed_dir: "data/processed/"
  train_split: 0.8
  random_state: 42
  target_column: "price"
  id_column: "car_ID"
  name_column: "CarName"

model:
  registered_model_name: "Car_Price_Production_Model"
  experiment_name: "Car_Price_Prediction_Registry"
  tracking_experiment: "Car_Price_Prediction_Tracking"
  baseline_models:
    decision_tree:
      max_depth: 5
      random_state: 42
    random_forest:
      n_estimators: 100
      max_depth: 10
      random_state: 42
  production_candidate:
    n_estimators: 150
    max_depth: 12
    random_state: 42

quality_gate:
  min_r2_score: 0.80
  max_rmse: 3500.0
  max_mae: 2500.0

api:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  log_level: "info"

monitoring:
  drift_significance_level: 0.05
  ks_threshold: 0.05
  psi_threshold: 0.2
  sample_window_size: 50
  inference_log_path: "logs/inference/inference_log.jsonl"
