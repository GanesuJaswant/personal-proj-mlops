name: Lab 13 - Continuous Monitoring & Drift Automation

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly trigger
  workflow_dispatch:

jobs:
  drift-monitoring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-api.txt

      - name: Run Data Drift & Concept Drift Analysis
        run: |
          python src/mlops_pipeline/12_create_evolved_dataset.py
          python src/mlops_pipeline/12_data_drift.py
          python src/mlops_pipeline/12_concept_drift.py
          python src/mlops_pipeline/12_drift_analysis.py

      - name: Check Retraining Trigger
        run: |
          python src/mlops_pipeline/12_monitor_trigger.py
